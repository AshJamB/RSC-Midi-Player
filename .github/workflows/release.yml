name: Release RSC MIDI Player

# Builds the portable .exe and publishes a GitHub Release automatically on
# every push to main that touches the app itself -- no manual tagging step.
# Adapted from the same pattern used in AshJamB/SilphNet's
# release-silphnet.yml, simplified for a single-project repo and switched to
# a Windows runner since PyInstaller has to build on the OS it targets.
#
# Versioning, first rule that applies wins:
#   1. the "version" input of a manual run (Actions tab > Run workflow),
#   2. "[release X.Y.Z]" anywhere in the commit message,
#   3. __version__ in rsc_midi_player.py, when it's ahead of every existing
#      vX.Y.Z tag -- so bumping __version__ is the normal way to cut a
#      release with a specific number,
#   4. otherwise the newest vX.Y.Z tag with its patch incremented
#      (1.2.9 rolls over to 1.2.10).
# Whichever wins gets written back into rsc_midi_player.py before building,
# so the built exe's title bar and About dialog always match the release
# they came from, even if you forgot to bump __version__ yourself.

on:
  push:
    branches: [main]
    paths:
      - "rsc_midi_player.py"
      - "build_exe.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.1.0). Leave blank to auto-resolve."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, sys

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          def parse(text):
              m = SEMVER.match(text or "")
              return tuple(int(p) for p in m.groups()) if m else None

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              raise SystemExit(1)

          with open("rsc_midi_player.py", encoding="utf-8") as fh:
              src = fh.read()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', src)
          file_version = m.group(1) if m else ""

          released = sorted(
              v for v in (parse(tag[1:]) for tag in sh("git", "tag", "-l", "v*").splitlines()) if v
          )
          latest = released[-1] if released else None

          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if not override:
              found = re.search(r"\[release\s+(\d+\.\d+\.\d+)\]", sh("git", "log", "-1", "--pretty=%B"))
              override = found.group(1) if found else ""

          file_ver = parse(file_version)
          if override:
              version = parse(override) or die(f"invalid version override {override!r} (expected X.Y.Z)")
              source = "the override"
          elif file_ver and (latest is None or file_ver > latest):
              version = file_ver
              source = "__version__ in rsc_midi_player.py"
          elif latest:
              major, minor, patch = latest
              version = (major, minor, patch + 1)
              source = "a patch bump on v%d.%d.%d" % latest
          else:
              die(f"__version__ {file_version!r} is not X.Y.Z and there is no vX.Y.Z tag to count from")

          text = "%d.%d.%d" % version
          print(f"Releasing {text}, from {source}.", file=sys.stderr)
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse to clobber an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump __version__ (or use a [release X.Y.Z] commit message) to pick a new one."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

      - name: Write resolved version into source
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          path = "rsc_midi_player.py"
          with open(path, encoding="utf-8") as fh:
              src = fh.read()
          new_src, n = re.subn(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{version}"', src, count=1)
          if n != 1:
              raise SystemExit("could not find __version__ line to update")
          with open(path, "w", encoding="utf-8") as fh:
              fh.write(new_src)
          print(f"Set __version__ = {version!r} for this build")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build portable exe
        run: python build_exe.py

      - name: Package release zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $zipName = "RSC-Midi-Player-$env:VERSION-windows.zip"
          $stageDir = "release-stage"
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item "dist/RSC-MIDI-Player.exe" -Destination $stageDir
          Copy-Item "README.md" -Destination $stageDir
          Copy-Item "LICENSE" -Destination $stageDir
          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' $range -- rsc_midi_player.py build_exe.py requirements.txt 2>/dev/null | head -50 || true)"

          notes="Portable Windows app -- download the zip, unzip anywhere, and run RSC-MIDI-Player.exe."
          if [ -n "$changes" ]; then
            notes="$notes"$'\n\n## Changes\n\n'"$changes"
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "RSC MIDI Player $VERSION" \
            --notes "$notes" \
            "$ZIP_NAME"

          echo "Published release $TAG"
